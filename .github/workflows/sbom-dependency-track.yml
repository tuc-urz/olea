# Generates a CycloneDX SBOM with Trivy and drops it into the Garage S3
# bucket. GitHub runners cannot reach Dependency-Track directly (internal
# network); an hourly uploader imports objects from incoming/ into DT and
# moves them to processed/.
---
name: SBOM to Dependency-Track

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM → S3 drop → Dependency-Track
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # projectVersion source: app marketing version (repo has no git tags).
      - name: Read app version
        id: ver
        run: echo "version=$(jq -r '.expo.version' apps/app-olea/app.json)" >> "$GITHUB_OUTPUT"

      # `--format cyclonedx` disables vuln scanning and enables --list-all-pkgs
      # automatically, so this produces a pure SBOM of the yarn.lock dependency
      # tree across all workspaces. The pinned version controls the emitted
      # CycloneDX spec version (must stay <= 1.6 for Dependency-Track v5).
      - name: Generate CycloneDX SBOM (Trivy fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json

      - name: Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # Object key = incoming/<project>/<version>/<build>.cdx.json — the
      # uploader parses <project>/<version> from this path to pick the DT
      # project, so the segments are deliberate: project "olea", version from
      # app.json (github.ref_name would always be "main" here).
      # SBOM_S3_KEY / SBOM_S3_SECRET = scoped Garage key; SBOM_S3_ENDPOINT /
      # SBOM_S3_REGION = Garage endpoint URL and region. All stored as CI
      # secrets. AWS_ENDPOINT_URL is honored by AWS CLI v2 (>= 2.13).
      - name: Upload SBOM to S3 drop bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SBOM_S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SBOM_S3_SECRET }}
          AWS_DEFAULT_REGION: ${{ secrets.SBOM_S3_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.SBOM_S3_ENDPOINT }}
        run: |
          aws s3 cp sbom.cdx.json \
            "s3://dependency-track-sbom-drop/incoming/olea/${{ steps.ver.outputs.version }}/${{ github.run_id }}.cdx.json"

# --- Follow-ups from the spec (deferred) ---------------------------------
# P1  Validate SBOM before upload (catches rare non-schema-compliant output):
#       npm exec -y -- @cyclonedx/cyclonedx-cli validate --input-file sbom.cdx.json --fail-on-errors
# P2  Add a weekly `schedule:` trigger to catch new CVEs in unchanged deps.
